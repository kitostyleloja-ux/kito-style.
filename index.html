<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kito Style</title><style>
:root{--gold:#d8b83d;--green:#18c936}*{box-sizing:border-box}body{margin:0;background:#020502;color:#f5f5f5;font-family:Arial;background-image:radial-gradient(ellipse at 10% 20%,#06391380,transparent 40%),radial-gradient(ellipse at 90% 65%,#06391355,transparent 35%)}button{cursor:pointer;border:0;border-radius:10px;padding:12px;color:white;background:linear-gradient(#18c936,#07591b);font-weight:bold}.outline{background:transparent;border:1px solid var(--gold);color:var(--gold)}header{height:78px;display:flex;justify-content:space-between;align-items:center;padding:10px 3%;position:sticky;top:0;background:#010302f5;border-bottom:1px solid #18b52e;z-index:5}.logo{font-weight:900;font-size:clamp(18px,3vw,32px);color:#e8c649;letter-spacing:3px;text-shadow:0 0 14px #816c25}.headicons{display:flex;gap:8px}.headicons button{background:transparent;padding:5px;font-size:22px}.hero{min-height:480px;display:flex;justify-content:flex-end;align-items:center;padding:30px 4%;background:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.08) 35%,rgba(0,0,0,.72) 62%,rgba(0,0,0,.2)),url('./banner.jpg.') left center/cover;border-bottom:1px solid #245d30}.heroText{width:50%;max-width:600px;text-align:center;background:#02070255;padding:18px;border-radius:14px}.hero h1{font-size:clamp(32px,6vw,78px);color:var(--gold);font-style:italic;text-shadow:0 2px 12px #000;margin:8px}.hero h2{letter-spacing:6px}.hero p{letter-spacing:3px;line-height:1.7}.hero button{border:2px solid var(--gold);border-radius:30px;background:#050505}.benefits{display:grid;grid-template-columns:repeat(4,1fr);padding:18px 3%;gap:10px;border-bottom:1px solid #293a2a}.benefit{display:flex;align-items:center;justify-content:center;gap:12px;text-align:center;font-size:13px}.benefit b{font-size:28px;color:var(--gold)}main{max-width:1500px;margin:auto}.section{padding:24px 3%}.heading{display:flex;align-items:center;gap:15px;text-align:center;font-size:26px}.heading:before,.heading:after{content:'';height:2px;background:linear-gradient(90deg,transparent,var(--gold));flex:1}.categories{display:flex;gap:14px;overflow:auto;padding:15px 2px}.category{min-width:112px;border:1px solid var(--gold);border-radius:18px;background:#080b08;padding:8px;text-align:center}.category img{width:100%;height:110px;object-fit:cover;border-radius:12px}.category p{font-size:12px;font-weight:bold}.toolbar{display:flex;gap:10px;margin:15px 0;flex-wrap:wrap}.toolbar input,.toolbar select{flex:1;min-width:140px;padding:12px;border:1px solid #716431;background:#080b08;color:white;border-radius:10px}.products{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.product{border:1px solid #796a34;border-radius:16px;overflow:hidden;background:#080b08;position:relative}.product img{width:100%;height:260px;object-fit:cover}.heart{position:absolute;right:10px;top:10px;border:1px solid #aaa;background:#111;padding:6px 10px;border-radius:50%;font-size:20px}.heart.on{color:#ff4770}.prodinfo{padding:12px}.prodname{font-weight:bold;min-height:34px}.desc{color:#aaa;font-size:12px}.price{font-size:21px;font-weight:bold;margin:10px 0}.buy{width:100%}.modal{position:fixed;inset:0;background:#000b;z-index:20;display:flex;align-items:center;justify-content:center;padding:15px}.dialog{width:min(720px,100%);max-height:90vh;overflow:auto;background:#101510;border:1px solid var(--gold);border-radius:16px;padding:20px}.dialog img{width:100%;max-height:350px;object-fit:contain}.cartrow{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #333;padding:12px 0}.qty{display:flex;gap:7px;align-items:center}.qty button{padding:6px 10px}.hidden{display:none!important}.bottomnav{position:sticky;bottom:0;background:#030604f7;border-top:1px solid #67572a;display:flex;justify-content:space-around;padding:8px;z-index:5}.bottomnav button{background:transparent;display:flex;flex-direction:column;align-items:center;font-size:12px}.bottomnav span{font-size:24px}.footer{text-align:center;color:#888;padding:25px}@media(max-width:850px){.hero{min-height:390px;padding:10px 2%}.heroText{width:55%;padding:8px}.hero h1{font-size:clamp(28px,7vw,46px)}.hero h2{font-size:13px;letter-spacing:3px}.hero p{font-size:12px;letter-spacing:1px}.hero button{font-size:12px}.benefits{grid-template-columns:repeat(2,1fr)}.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.product img{height:180px}.section{padding:16px 3%}.heading{font-size:22px}}@media(max-width:430px){header{height:72px}.logo{font-size:17px}.hero{min-height:370px}.heroText{width:56%}.hero h1{font-size:28px}.hero h2{font-size:11px;letter-spacing:1px}.hero p{font-size:10px}.product img{height:160px}.prodinfo{padding:10px}.price{font-size:18px}}@media(min-width:1000px){.bottomnav{display:none}}
</style></head><body>
<header><button class="outline" onclick="scrollCats()">☰</button><div class="logo">KITO STYLE</div><div class="headicons"><button onclick="focusSearch()">⌕</button><button onclick="favView()">♡</button><button onclick="cartView()">🛒<sup id="count">0</sup></button></div></header>
<section class="hero"><div class="heroText"><h1>Kito Style</h1><h2>MODA MASCULINA</h2><p>ESTILO, QUALIDADE E ELEGÂNCIA<br>PARA O HOMEM MODERNO.</p><button class="outline" onclick="document.getElementById('catalog').scrollIntoView({behavior:'smooth'})">🛒 CONFIRA A COLEÇÃO　›</button></div></section>
<section class="benefits"><div class="benefit"><b>♧</b><strong>ENTREGA<br>PARA TODO BRASIL</strong></div><div class="benefit"><b>✓</b><strong>COMPRA<br>SEGURA</strong></div><div class="benefit"><b>▤</b><strong>PAGAMENTO<br>FACILITADO</strong></div><div class="benefit"><b>☏</b><strong>ATENDIMENTO<br>NO WHATSAPP</strong></div></section>
<main><section class="section" id="catSection"><h2 class="heading">CATEGORIAS</h2><div class="categories" id="categories"></div></section><section class="section" id="catalog"><h2 class="heading" id="title">DESTAQUES DA LOJA</h2><div class="toolbar"><input id="search" placeholder="Buscar produto..." oninput="draw()"><select id="sort" onchange="draw()"><option value="">Ordenar</option><option value="low">Menor preço</option><option value="high">Maior preço</option><option value="az">Nome A–Z</option></select><button class="outline" onclick="reset()">Todos</button></div><div class="products" id="products"></div></section></main>
<div class="modal hidden" id="detailModal" onclick="if(event.target===this)closeDetail()"><div class="dialog" id="detail"></div></div><div class="modal hidden" id="cartModal" onclick="if(event.target===this)closeCart()"><div class="dialog"><h2>Carrinho</h2><div id="cartItems"></div><h3 id="total"></h3><input id="customer" placeholder="Nome (opcional)" style="width:100%;padding:12px;background:#080b08;color:white"><button onclick="checkout()">FINALIZAR PELO WHATSAPP</button><button class="outline" onclick="closeCart()">Voltar</button></div></div>
<nav class="bottomnav"><button onclick="window.scrollTo({top:0,behavior:'smooth'})"><span>⌂</span>Início</button><button onclick="scrollCats()"><span>▦</span>Categorias</button><button onclick="promos()"><span>◇</span>Promoções</button><button onclick="contact()"> <span>☏</span>WhatsApp</button><button onclick="cartView()"><span>🛒</span>Carrinho</button></nav><footer class="footer">KITO STYLE · MODA MASCULINA</footer>
<script>
const whatsapp=localStorage.getItem('kito_whatsapp')||'';let items=JSON.parse(localStorage.getItem('kito_products')||'null')||[{id:1,name:'Polo Masculina',desc:'Polo masculina com acabamento premium.',price:229.90,cat:'Camisas Polo',img:'https://images.unsplash.com/photo-1625910513413-5fc7b8a2d9b2?auto=format&fit=crop&w=700&q=80'},{id:2,name:'Camiseta Básica',desc:'Camiseta versátil para o dia a dia.',price:189.90,cat:'Camisetas',img:'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=700&q=80'},{id:3,name:'Bermuda',desc:'Bermuda casual masculina.',price:159.90,cat:'Bermudas',img:'https://images.unsplash.com/photo-1591195853828-11db59a44f6b?auto=format&fit=crop&w=700&q=80'},{id:4,name:'Jaqueta',desc:'Jaqueta moderna.',price:349.90,cat:'Jaquetas',img:'https://images.unsplash.com/photo-1551028719-00167b16eac5?auto=format&fit=crop&w=700&q=80'}];let cart=[],favorites=JSON.parse(localStorage.getItem('kito_favorites')||'[]'),filter='Todos',favsOnly=false;
const cats=[['Camisas Polo','https://images.unsplash.com/photo-1625910513413-5fc7b8a2d9b2?auto=format&fit=crop&w=300&q=70'],['Camisetas','https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=300&q=70'],['Bermudas','https://images.unsplash.com/photo-1591195853828-11db59a44f6b?auto=format&fit=crop&w=300&q=70'],['Calças','https://images.unsplash.com/photo-1542272604-787c3835535d?auto=format&fit=crop&w=300&q=70'],['Jaquetas','https://images.unsplash.com/photo-1551028719-00167b16eac5?auto=format&fit=crop&w=300&q=70'],['Bonés','https://images.unsplash.com/photo-1588850561407-ed78c282e89b?auto=format&fit=crop&w=300&q=70'],['Perfumes','https://images.unsplash.com/photo-1594035910387-fea47794261?auto=format&fit=crop&w=300&q=70'],['Acessórios','https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=300&q=70']];
function money(n){return Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function drawCats(){document.getElementById('categories').innerHTML=cats.map(([n,i])=>'<button class="category" data-category="'+n+'" onclick="category(this.dataset.category)"><img src="'+i+'"><p>'+esc(n.toUpperCase())+'</p></button>').join('')}
function draw(){let q=document.getElementById('search').value.toLowerCase();let list=items.filter(p=>(filter==='Todos'||p.cat===filter)&&(!favsOnly||favorites.includes(p.id))&&(!q||[p.name,p.desc,p.cat].join(' ').toLowerCase().includes(q)));let s=document.getElementById('sort').value;if(s==='low')list.sort((a,b)=>a.price-b.price);if(s==='high')list.sort((a,b)=>b.price-a.price);if(s==='az')list.sort((a,b)=>a.name.localeCompare(b.name));document.getElementById('products').innerHTML=list.map(p=>'<article class="product"><button class="heart '+(favorites.includes(p.id)?'on':'')+'" onclick="favorite('+p.id+')">'+(favorites.includes(p.id)?'♥':'♡')+'</button><img src="'+esc(p.img)+'" alt="'+esc(p.name)+'" onerror="this.style.display=\'none\'" onclick="detailView('+p.id+')"><div class="prodinfo"><div class="prodname">'+esc(p.name)+'</div><div class="desc">'+esc(p.desc)+'</div><div class="price">'+money(p.price)+'</div><button class="buy" onclick="add('+p.id+')">🛒 Comprar</button><button class="outline" style="width:100%;margin-top:8px" onclick="detailView('+p.id+')">Ver detalhes</button></div></article>').join('');document.getElementById('title').textContent=favsOnly?'FAVORITOS':filter==='Todos'?'DESTAQUES DA LOJA':filter.toUpperCase()}
function category(c){filter=c;favsOnly=false;draw();document.getElementById('catalog').scrollIntoView({behavior:'smooth'})}function reset(){filter='Todos';favsOnly=false;document.getElementById('search').value='';draw()}function promos(){category('Promoções')}function scrollCats(){document.getElementById('catSection').scrollIntoView({behavior:'smooth'})}function focusSearch(){document.getElementById('catalog').scrollIntoView({behavior:'smooth'});setTimeout(()=>document.getElementById('search').focus(),300)}
function favorite(id){favorites.includes(id)?favorites=favorites.filter(x=>x!==id):favorites.push(id);localStorage.setItem('kito_favorites',JSON.stringify(favorites));draw()}function favView(){favsOnly=true;filter='Todos';draw();document.getElementById('catalog').scrollIntoView({behavior:'smooth'})}
function detailView(id){let p=items.find(x=>x.id===id);document.getElementById('detail').innerHTML='<button class="outline" onclick="closeDetail()">← Voltar</button><img src="'+esc(p.img)+'"><h2>'+esc(p.name)+'</h2><p>'+esc(p.desc)+'</p><h2>'+money(p.price)+'</h2><p>'+esc(p.cat)+'</p><button onclick="add('+p.id+');closeDetail()">Adicionar ao carrinho</button><button class="outline" onclick="favorite('+p.id+')">Favoritar ♡</button>';document.getElementById('detailModal').classList.remove('hidden')}function closeDetail(){document.getElementById('detailModal').classList.add('hidden')}
function add(id){let p=items.find(x=>x.id===id),i=cart.find(x=>x.id===id);i?i.qty++:cart.push({...p,qty:1});count()}function count(){document.getElementById('count').textContent=cart.reduce((a,p)=>a+p.qty,0)}function cartView(){document.getElementById('cartModal').classList.remove('hidden');renderCart()}function closeCart(){document.getElementById('cartModal').classList.add('hidden')}function changeQty(id,d){let i=cart.find(x=>x.id===id);if(i)i.qty+=d;if(i&&i.qty<=0)cart=cart.filter(x=>x.id!==id);count();renderCart()}function renderCart(){document.getElementById('cartItems').innerHTML=cart.map(p=>'<div class="cartrow"><span>'+esc(p.name)+'<br>'+money(p.price)+'</span><div class="qty"><button class="outline" onclick="changeQty('+p.id+',-1)">−</button>'+p.qty+'<button onclick="changeQty('+p.id+',1)">+</button></div><b>'+money(p.price*p.qty)+'</b></div>').join('')||'<p>Carrinho vazio.</p>';document.getElementById('total').textContent='Total: '+money(cart.reduce((s,p)=>s+p.price*p.qty,0))}
function checkout(){if(!whatsapp){alert('O WhatsApp da loja será configurado na etapa do proprietário.');return}if(!cart.length){alert('Carrinho vazio.');return}let m='Pedido Kito Style:\n'+cart.map(p=>p.name+' x '+p.qty+' — '+money(p.price*p.qty)).join('\n')+'\nTotal: '+money(cart.reduce((s,p)=>s+p.price*p.qty,0))+'\nCliente: '+document.getElementById('customer').value;window.open('https://wa.me/'+whatsapp+'?text='+encodeURIComponent(m),'_blank')}function contact(){if(!whatsapp){alert('WhatsApp será configurado na etapa do proprietário.');return}window.open('https://wa.me/'+whatsapp,'_blank')}drawCats();draw();
</script></body></html>
